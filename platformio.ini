; PlatformIO — my recommendation over both IDEs.
;
; It installs its own toolchain into the project, doesn't have the ESP-IDF
; VS Code extension's self-repair loop, and uses the Arduino framework so the
; same sources work either way. Install the "PlatformIO IDE" extension in
; VS Code, open this folder, press Build.
;
;   pio run              build
;   pio run -t upload    flash
;   pio device monitor   serial
;
; The sources here are the shared ones under sprinkles/ plus the Arduino glue
; from arduino_src/ — no separate copy to keep in sync.

[env:sprinkles]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3R8: 8MB octal PSRAM, 16MB flash. The frame buffer needs the PSRAM,
; so if the board reports 0 bytes free, this line is the first suspect —
; confirm the variant against the schematic.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -Isprinkles
    -Iarduino_src
    -Wall

build_src_filter =
    +<../sprinkles/*.c>
    +<../arduino_src/*.cpp>
    +<../arduino_src/*.ino>

; Native host build: the tests, no hardware. `pio test -e native` isn't wired
; up — use the Makefile for that, it's simpler and already green.
